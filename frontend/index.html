<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Hector Collector | Podio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 640px; margin: 2rem auto; }
    label { display:block; margin:.75rem 0 .25rem; font-weight:600; }
    input, button { width:100%; padding:.6rem; font-size:1rem; }
    button { margin-top:1rem; cursor:pointer; }
    .ok { color:#1a7f37; margin-top:.75rem; }
    .err { color:#b00020; margin-top:.75rem; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>Hector Collector</h1>

  <form id="podio-form">
    <label for="marque_modele">Marque et modèle</label>
    <input id="marque_modele" name="marque_modele" required />

    <label for="numero_inventaire">Numéro d'inventaire</label>
    <input id="numero_inventaire" name="numero_inventaire" required />

    <label for="date_achat">Date d'achat (AAAA-MM-JJ)</label>
    <input id="date_achat" name="date_achat" />

    <label for="date_fin_garantie">Date de fin de garantie (AAAA-MM-JJ)</label>
    <input id="date_fin_garantie" name="date_fin_garantie" />

    <label for="fournisseur">Fournisseur</label>
    <input id="fournisseur" name="fournisseur" />

    <button type="submit">Soumettre</button>
    <div id="msg"></div>
  </form>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
